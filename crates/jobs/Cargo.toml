# Ubicación: `crates/jobs/Cargo.toml`
#
# Descripción: Módulo de jobs - tareas en background.
#              Implementación con Tokio JoinSet + cola en memoria.
#              Zero-dependency extra (solo tokio + serde).
#
# ADRs relacionados: 0020 (Monitoreo Regional)

[package]
name = "jobs"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[lib]
path = "src/lib.rs"