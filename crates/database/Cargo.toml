# Ubicación: `crates/database/Cargo.toml`
#
# Descripción: Capa de base de datos - repositorios SQLx.
#               Depende de domain + sqlx.
#
# ADRs relacionados: 0004 (PostgreSQL), 0020 (Monitoreo Regional)

[package]
name = "database"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
uuid = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
moka = { workspace = true }