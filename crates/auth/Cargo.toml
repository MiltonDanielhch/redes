# Ubicación: `crates/auth/Cargo.toml`
#
# Descripción: Capa de autenticación - PASETO v4 + Argon2id.
#               JWT PROHIBIDO - usa PASETO v4 Local exclusivamente.
#
# ADRs relacionados: 0008 (PASETO)

[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
base64 = "0.22"
thiserror = "2.0.18"
rusty_paseto = { version = "0.10.0", features = ["batteries_included"] }
argon2 = { version = "0.5.3", features = ["std"] }
password-hash = { version = "0.6", features = ["rand_core"] }
time = { version = "0.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"