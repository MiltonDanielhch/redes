# ADRs relacionados: 0001 (Hexagonal)

[package]
name = "domain"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.18"
uuid = { workspace = true }
time = { workspace = true }
serde = { workspace = true }