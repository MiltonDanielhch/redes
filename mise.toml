# Ubicación: `mise.toml`
#
# Descripción: Configuración de mise para gestión de toolchains.
#              Define versiones de Rust, Node, pnpm, y herramientas.
#
# ADRs relacionados: 0012 (Herramientas de Desarrollo)

[tools]
rust = "1.95.0"
node = "24"
pnpm = "11.1"
just = "1.51"
cargo-deny = "0.19.6"
lefthook = "2.1.6"

[settings]
python = { version = "3.13", create_alias = true }
go = { version = "1.24", create_alias = true }